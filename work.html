<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Experience</title>
</head>
<body>
    <header>
        <h1>Work Experience</h1>
    </header>
    <main>
        <form>
            <fieldset>
                <legend>
                    Work Experience Details
                </legend>
                <fieldset>
                    <legend>
                        Any Job Experience If any Write in details
                    </legend>
                    <label for="job">Write your job experience in details</label>
                    <textarea id="job" name="job"></textarea>
                </fieldset>
                <fieldset>
                    <legend>
                        If any of the experience you have write in details 
                    </legend>
                    <label for="freelance">Freelance Work:</label>
                    <textarea id="freelance" name="freelance"></textarea>
                    <br>
                    <br>
                     <label for="internship">Internship:</label>
                    <textarea id="internship" name="internship"></textarea>
                    <br>
                    <br>
                     <label for="volunteer">Volunteer Work:</label>
                    <textarea id="volunteer" name="volunteer"></textarea>
                    <br>
                    <br>
                    <label for="personal"> Personal projects with measurable outcomes:</label>
                    <textarea id="personal" name="personal_projects"></textarea>
                    <br>
                    <br>
                     <label for="leadership">Leadership roles(if any):</label>
                    <textarea id="leadership" name="leadership"></textarea>
                </fieldset>
            </fieldset>
            <br>
        <button type="submit">Submit</button>
        </form>
    </main>
    <br>
    <br>
    <br>
    <br>
    <br>
    <footer>
        <h3>
        <a href="./certification.html">Click here to move to next page to fill the other credentials</a>
    </h3>
    </footer>
</body>
</html>
