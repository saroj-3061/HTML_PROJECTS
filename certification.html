<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certification form</title>
</head>
<body>
    <header>
        <h1>Certification</h1>
    </header>
    <main>
        <form>
            <fieldset>
                <legend>
                    Certification Details
                </legend>
                <label for="certification_name">Certification Name:</label>
                <input type="text" id="certification_name" name="certification_name" size="50" minlength="5" maxlength="50">
<br>
<br>
                <label for="organization">Organization Name from where you get Certificate:</label>
<input type="text" id="organization" name="organization" size="80" minlength="5" maxlength="80">
<br>
<br>
<label for="certification_year">Year you get Certification:</label>
<input type="number" id="certification_year" name="certificaiton_year" size="8" minlength="4" maxlength="4" placeholder="eg. 2026">

            </fieldset>
            <br>
            <button type="submit">Submit</button>
        </form>
        <br>
        <br>
        <br>
        <h3><a href="./certification.html">Click here to add another certification(if you have):</a></h3>
    </main>
