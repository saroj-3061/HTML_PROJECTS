<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body>
    <header>
        <h1>Technical Skills</h1>

    <main>
        <form>
        <fieldset>
            <legend>
                Technical Skills
            </legend>
            <fieldset>
                <legend>Prorgramming Languages
                    </legend>
            <label for="python">Python</label>
            <input type="checkbox" id="python" name="programming" value="python">
            <label for="c">C</label>
            <input type="checkbox" id="c" name="programming" value="c">
            <label for="javascript">JavaScript</label>
            <input type="checkbox" id="javascript" name="programming" value="javascript">
            <label for="c++">C++</label>

<label for="java">Java</label>

            <label for="sql">SQL</label>
            <input type="checkbox" id="sql" name="programming" value="sql">
            <label for="c#">C#</label>
            <input type="checkbox" id="c#" name="programming" value="c#">

            <input type="checkbox" id="visual_basic" name="programming" value="visaul_basic">
        <label for="rust">Rust</label>
            <input type="checkbox" id="rust" name="programming" value="rust">
                    </fieldset>
<br>

                    <fieldset>
                        <legend>
                            Frontends
                        </legend>

            <input type="checkbox" id="html" name="frontend" value="html">

            <input type="checkbox" id="css" name="frontend" value="css">

             <label for="react">React</label>
            <input type="checkbox" id="react" name="frontend" value="react">
                    </fieldset>
        <br>
        <fieldset>
            <legend>
                Backends
            </legend>
             <label for="fastapi">FastAPi</label>
            <input type="checkbox" id="fastapi" name="backend" value="fastapi">
              <label for="flask">Flask</label>
            <input type="checkbox" id="flask" name="backend" value="flask">
              <label for="django">Django</label>
            <input type="checkbox" id="django" name="backend" value="django">
              <label for="restapi">REST APIs</label>
            <input type="checkbox" id="restapi" name="backend" value="restapi">
        </fieldset>
<br>
<fieldset>
    <legend>
        Databases
    </legend>
      <label for="sqlite">SQLite</label>
            <input type="checkbox" id="sqlite" name="database" value="sqlite">
            <label for="monogodb">MongoDB</label>
            <input type="checkbox" id="mongodb" name="database" value="mongodb">
            <label for="postgresql">PostgreSQL</label>
            <input type="checkbox" id="postgresql" name="database" value="postgresql">
            <label for="mysql">MySQL</label>
            <input type="checkbox" id="mysql" name="database" value="mysql">
</fieldset>
<br>

<fieldset>
    <legend>
        Tools
    </legend>
    <label for="git">Git</label>
            <input type="checkbox" id="git" name="tool" value="git">
                <label for="github">GitHub</label>
            <input type="checkbox" id="github" name="tool" value="github">
                <label for="vscode">Vs Code</label>
            <input type="checkbox" id="vscode" name="tool" value="vscode">
                <label for="docker">Docker</label>
            <input type="checkbox" id="docker" name="tool" value="docker">
</fieldset>
<br>

<fieldset>
<legend>
    Cloud
</legend>
    <label for="aws">AWS(Basic)</label>
            <input type="checkbox" id="aws" name="cloud" value="aws">
             <label for="cloudfare">AWS(Basic)</label>
            <input type="checkbox" id="cloudfare" name="cloud" value="cloudfare">
</fieldset>

                </fieldset>
