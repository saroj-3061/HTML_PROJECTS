<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Information</title>
</head>
<body>
    <header>
        <h1>Contact Information</h1>
        <h2>Fill the contact information form to move ahead</h2>
    </header>
    <main>
        <form>
            <fieldset>
                <legend>
                    Contact Information Form
                </legend>
                <label for="name">Enter Full Name:</label>
                <input required type="text" id="name" name="name" placeholder="eg. Saroj Paudel" minlength="5" maxlength="30" size="30">
                <br>
                <br>
                <label for="email">Enter Email:</label>
                <input required type="email" id="email" name="email" placeholder="eg. example@gmail.com" minlength="5" maxlength="50" size="50">
            <br>
            <br>
                <label for="number">Enter Phone Number:</label>
            <input required type="number" id="number" name="number" minlength="10" maxlength="20" placeholder="eg. 97XXXXXXXX">
            <br>
            <br>
            <label for="address">Enter Full Address:</label>
            <input required type="text" id="address" name="address" placeholder="Rural/Urban, District, Country" minlength="20" maxlength="70" size="70">
<br>
<br>
<label for="github">Github(for developers):</label>
<input type="url" id="github" name="github" placeholder="eg. https://github.com/sarojpaudel" minlength="20" maxlength="100" size="100">
<br>
<br>
<label for="linkedin">LinkedIn:</label>
<input type="url" id="linkedin" name="linkedin" placeholder="eg. https://linkedin.com/in/sarojpaudel" minlength="30" maxlength="100" size="100">
<br>
<br>
<label for="website">Portfolio Website:</label>
<input type="url" id="website" name="website" placeholder="eg. https://sarojpaudel.com" minlength="10" maxlength="100" size="100">
            </fieldset>
            <br>
           <button type="submit">Submit</button>
        </form>
    </main>
    <br>
    <br>
    <br>
    <br>
    <br>
    <br>
    <footer>
        <h3><a href="./summary.html">Click here to move to next page to fill the other credentials</a></h3>
    </footer>
</body>
</html>
