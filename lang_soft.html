<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Languages and Soft Skill</title>
</head>
<body>
    <header>
        <h1>
            Languages and Soft Skills
        </h1>
    </header>
    <main>
        <form>
            <fieldset>
                <legend>
                    Languages and Soft Skils Details
                </legend>
                <fieldset>
                    <legend>
                        Languages
                    </legend>
                    <label for="native">Native Languages:</label>
                    <input required type="text" id="native" name="native" size="100" minlength="3" maxlength="100">
                    <br>
                    <br>
                    <label for="working_proficency">Professional Working Proficency Languages:</label>
                    <input type="text" id="working_proficency" name="working_proficency" size="100" minlength="3" maxlength="100">
                    <br>
                    <br>
                    <label for="conversational">Conversational Languages:</label>
                    <input type="text" id="conversational" name="conversational" size="100" minlength="3" maxlength="100">
                </fieldset>
                <br>
                <br>
                <fieldset>
                    <legend>
                        Soft Skills(Only include skills you can demonstrate)
                    </legend>
                    <label for="softskill">Soft Skills:</label>
                    <textarea maxlength="1000" id="softskill" name="softskill" placeholder="eg. 1)Teamwork-(little bit explanation)   2)Communation- (little bit explanation)..............."></textarea>
                </fieldset>
            </fieldset>
            <br>
            <button type="submit">Submit</button>
        </form>
    </main>
    <footer>
        <h3>
        <a href="./generate.html">Click here to generate your CV(resume)</a>
    </h3>
    </footer>
</body>
</html>
