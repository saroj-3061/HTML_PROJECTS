<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Education</title>
</head>
<body>
    <header>
        <h1>Education</h1>
    </header>
    <main>
        <form>
            <fieldset>
                <legend>
                    Education Details
                </legend>
                <label for="degree">Degree(if any):</label>
                <input type="text" id="degree" name="degree" size="100" minlength="10" maxlength="100">
                <br>
                <br>
                <label for="graduation">Graduation Year:</label>
                <input type="number" id="graduation" name="graduation" size="20" minlength="4" maxlength="10" placeholder="eg. 2026">
                <br>
                <br>
                <label for="school">School level Passed out Class:</label>
                <input required type="number" id="school" name="school" size="40" minlength="1" maxlength="5" placeholder="eg. 10 or 12 or any you have passed out">
                <br>
                <br>
                <label for="schoolgpa">School GPA:</label>
                <input required type="number" id="schoolgpa" name="schoolgpa" size="10" minlength="3" maxlength="5" placeholder="eg. 3.10">
                <br>
                <br>
                <label for="course">Relevant Courework done(if any):</label>
                <input type="text" id="course" name="course" size="100" minlength="10" maxlength="100">
            </fieldset>
            <br>
        <button type="submit">Submit</button>
        </form>
    </main>
    <br>
    <br>
    <br>
    <br>
    <br>
    <br>
    <br>
    <footer>
         <h3>
        <a href="./project.html">Click here to move to next page to fill the other credentials</a>
    </h3>
    </footer>
</body>
</html>
